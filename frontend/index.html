<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B3 - Consulta de Ativos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .loading { opacity: 0.6; pointer-events: none; }
        .card-header { background: #007bff; color: white; }
        .btn-primary { background: #007bff; border: none; }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">📈 B3 - Consulta de Ativos</h1>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-4">
                <div class="card mb-3">
                    <div class="card-header">
                        <h5 class="mb-0">🔍 Selecionar Ativo</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Ativo:</label>
                            <select id="ativoSelect" class="form-select">
                                <option value="">Carregando ativos...</option>
                            </select>
                        </div>
                        <button id="consultarBtn" class="btn btn-primary w-100">
                            <span id="btnText">🔎 Consultar</span>
                            <span id="btnLoading" class="d-none">
                                <span class="spinner-border spinner-border-sm me-2"></span>
                                Carregando...
                            </span>
                        </button>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">📊 Resumo</h5>
                    </div>
                    <div class="card-body" id="resumoCard">
                        <p class="text-muted text-center">Selecione um ativo para ver o resumo</p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">📈 Gráfico de Cotações</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="cotacoesChart" height="100"></canvas>
                        <div id="noDataMessage" class="text-center text-muted mt-5">
                            <i class="fs-1">📊</i>
                            <p>Selecione um ativo para visualizar o gráfico</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">📋 Tabela de Cotações</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped" id="cotacoesTable">
                                <thead class="table-dark">
                                    <tr>
                                        <th>📅 Data</th>
                                        <th>🟢 Abertura</th>
                                        <th>🔴 Mínimo</th>
                                        <th>🔵 Máximo</th>
                                        <th>🟡 Fechamento</th>
                                        <th>📊 Volume</th>
                                    </tr>
                                </thead>
                                <tbody id="cotacoesTableBody">
                                    <tr>
                                        <td colspan="6" class="text-center text-muted">
                                            Selecione um ativo para ver os dados
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
